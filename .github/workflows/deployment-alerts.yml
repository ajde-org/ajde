# Posts failed Vercel deployments to the #alerts Discord channel.
#
# Vercel sends a repository_dispatch event to GitHub when a deployment changes
# state ("Repository Dispatch Events" in the Vercel project's Git settings).
# GitHub only runs repository_dispatch workflows from the default branch (dev).
#
# Only production and the dev preview alert: a failed feature-branch preview
# already shows as a failed check on its PR, and #alerts should stay quiet
# enough that a message means "look now".
#
# Needs the DISCORD_ALERTS_WEBHOOK_URL repository secret.
# Run it by hand from the Actions tab to send a test message.

name: Deployment alerts

on:
  repository_dispatch:
    types:
      - vercel.deployment.error
      - vercel.deployment.failed
  workflow_dispatch:

permissions: {}

jobs:
  notify-discord:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event.client_payload.environment == 'production' ||
         github.event.client_payload.git.ref == 'dev') &&
        github.event.client_payload.state.detail != 'deployment_deleted'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' }}
          ENVIRONMENT: ${{ github.event.client_payload.environment }}
          REF: ${{ github.event.client_payload.git.ref }}
          SHA: ${{ github.event.client_payload.git.sha }}
          SHORT_SHA: ${{ github.event.client_payload.git.shortSha }}
          STATE: ${{ github.event.client_payload.state.type }}
          DETAIL: ${{ github.event.client_payload.state.detail }}
          ERROR: ${{ github.event.client_payload.error }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DISCORD_ALERTS_WEBHOOK_URL secret is not set"
            exit 1
          fi

          deployments_url="https://vercel.com/ajde/ajde/deployments"

          if [ "$IS_TEST" = "true" ]; then
            content="🧪 Test alert from the Deployment alerts workflow. If you can read this, #alerts is wired up."
          else
            content=$(printf '🚨 **Vercel deployment %s** (%s)\nBranch `%s`, commit [%s](%s/%s/commit/%s)\nReason: %s\n%s' \
              "$STATE" "$ENVIRONMENT" "$REF" "$SHORT_SHA" "$SERVER_URL" "$REPO" "$SHA" \
              "${ERROR:-${DETAIL:-unknown}}" "$deployments_url")
          fi

          jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}' \
            | curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' \
                --data-binary @- "$WEBHOOK_URL"
